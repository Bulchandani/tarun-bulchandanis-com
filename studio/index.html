<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Studio — Tarun Bulchandani</title>
<link rel="icon" href="data:,">
<style>
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #fafaf6; }
  .splash {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    text-align: center;
  }
  .splash h1 {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    font-size: 28px;
    margin: 0 0 8px;
    color: #1a1a2e;
    letter-spacing: -0.02em;
  }
  .splash p { color: #6f6f6f; font-size: 15px; max-width: 420px; margin: 6px auto; }
  .spinner {
    display: inline-block;
    width: 28px; height: 28px;
    border: 3px solid #e0dccb;
    border-top-color: hsl(187, 74%, 32%);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 18px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="splash" id="splash">
  <div class="spinner" aria-hidden="true"></div>
  <h1>Loading editor…</h1>
  <p>If this takes more than a few seconds, check your network or refresh the page.</p>
</div>

<!-- DEBUG: visible log of every postMessage received on /studio/. Helps
     diagnose Safari OAuth issues. Remove once login is confirmed working. -->
<div id="msg-debug" style="position:fixed;bottom:8px;left:8px;max-width:60vw;max-height:40vh;overflow:auto;background:rgba(0,0,0,0.8);color:#0f0;font-family:monospace;font-size:11px;padding:8px;z-index:9999;border-radius:4px;">
  <div style="color:#fff;margin-bottom:4px;">postMessage debug:</div>
</div>
<script>
  (function() {
    var d = document.getElementById("msg-debug");
    function log(s) { d.appendChild(Object.assign(document.createElement("div"), { textContent: s })); d.scrollTop = d.scrollHeight; }
    log("listener registered at " + new Date().toISOString());
    window.addEventListener("message", function(e) {
      var preview = typeof e.data === "string" ? e.data.slice(0, 120) : JSON.stringify(e.data).slice(0, 120);
      log("[msg] origin=" + e.origin + " data=" + preview);
    });
    // Detect if Decap mounts despite messages
    setInterval(function() {
      var hasDecap = document.querySelector("[class*=\"nc-app\"], [class*=\"AppMainContainer\"]");
      if (hasDecap) {
        log("decap mounted ✓");
        d.style.display = "none";
      }
    }, 1000);
  })();
</script>

<!-- Decap CMS — loaded from their CDN. The config.yml in this folder
     describes the blog schema (post fields, where they live, etc.). -->
<script src="https://unpkg.com/decap-cms@^3.8.4/dist/decap-cms.js"></script>

<script>
  // Hide the splash once Decap mounts its UI.
  (function() {
    function hideSplash() {
      var splash = document.getElementById('splash');
      if (splash) splash.style.display = 'none';
    }
    if (typeof MutationObserver === 'undefined') {
      setTimeout(hideSplash, 1500);
      return;
    }
    var obs = new MutationObserver(function() {
      // Decap mounts its own root inside <body>; once we see anything other
      // than the splash, hide it.
      var others = Array.from(document.body.children).filter(function(el) {
        return el.id !== 'splash' && el.tagName !== 'SCRIPT';
      });
      if (others.length > 0) {
        hideSplash();
        obs.disconnect();
      }
    });
    obs.observe(document.body, { childList: true, subtree: false });
    // Fallback: hide after 6s regardless
    setTimeout(hideSplash, 6000);
  })();
</script>
</body>
</html>
